help:
  title: "操作方法"
  drag_drop: "・将文件拖放到图像显示区域即可插入图像。"
  zoom: "・使用鼠标滚轮放大缩小（以光标位置为中心）。"
  pan: "・右键拖动平移。"
  reopen_params: "・双击右侧列表中的行，可重新编辑该处理的参数。"
  disable_item: "・取消勾选可暂时停用该处理。"
  select_rows: "・单击行可将其选中。Ctrl 单击可添加/取消，Shift 单击可选择范围。"
  copy_paste: "・所选处理可用 Ctrl+C 复制、Ctrl+V 粘贴。也可粘贴到其他标签页。"
  paste_position: "・粘贴内容会添加到各分类列表的末尾。"
  category_order: "・处理按 输入 → 预处理 → 分析 → 输出 的分类顺序执行。添加的处理进入该分类的末尾，可用 ▲▼ 仅调整分类内的顺序。"
  recompute_note: "・排序、启用/停用切换、删除、粘贴不会立即计算。在按下「重新计算」(F5) 之前，显示（包括测量结果）保持不变，期间按钮变为橙色。"
  preview_note: "・打开参数调整对话框或测量模式时，会自动计算以便即时查看结果。关闭时（取消时恢复原值）也会重新计算。"
  change_insert_file: "・双击插入图像的行以更改要读取的文件，会立即重新计算。"
  export_on_recompute: "・图像输出、结果输出的文件保存仅在按下「重新计算」(F5) 时执行（不会在对话框的「确定」时保存）。"
  reload_sources: "・磁盘上的图像已更新时，请使用 命令 → 重新读取源文件并重新计算。"
  auto_scale: "・如果可从 TIFF 的 FEI / Thermo Fisher 标签或 ImageJ 的单位信息中读取像素的实际尺寸，插入图像后会立即自动添加「比例尺设置」命令。"
  manual_scale: "・无法读取时，比例尺为未设置状态，无法显示实际尺寸（保持像素单位）。可通过 命令 → 输入 → 比例尺设置 手动输入从比例尺条读取的值。"
  filters: "・滤镜（高斯模糊・中值滤镜・反锐化掩模）: 可通过 命令 → 预处理 → 滤镜 添加。"
  measure_intro: "・测量: 通过 命令 → 分析 → 测量... 将右侧面板切换为测量工具。"
  measure_create: "・两点测量・边界线通过在图像上单击 2 次来创建（按 Esc 或右键单击可取消创建过程）。"
  measure_undo: "・测量模式中，可用 Ctrl+Z / Ctrl+Shift+Z 撤销・重做工具操作。"
  measure_snap: "・吸附开启时，两点测量的端点会吸附到现有的边界线・偏移线上。"
  measure_select_move: "・未选择工具时，可单击测量・边界线将其选中并拖动移动（单击端点附近仅移动端点，单击线上则整体移动）。"
  measure_range_select: "・范围选择: 使用工具的「范围选择」拖动时，会一并选择中心位置位于框内的测量。在框内拖动可整体移动，拖动框的边・角可连同测量一起缩放（以对边为基准）。拟合的重新计算在拖动结束后进行。"
  measure_fitting: "・拟合可选择峰值（固定正峰・固定负峰）和阶跃（固定正阶跃・固定负阶跃）。框边缘的明暗表示方向。"
  measure_fit_edit: "・未选择工具时，双击拟合区域可重新编辑仅该测量的拟合设置（下方会显示亮度剖面和拟合曲线的图表。无拟合模式在单击位置显示竖线）。"
  measure_duplicate: "・直线复制: 单击测量・边界线将其选中，移动鼠标指定方向和距离，再次单击确认。用滚轮调整复制数量 (1-20)，在距离等分的位置进行复制。"
  measure_duplicate_group: "・复制的测量，若设置中的「复制」为「原样」则进入复制源的组，为「添加组」则每个测量进入新组。"
  measure_duplicate_ctrl: "・在范围选择的框内按住 Ctrl 键拖动，可复制选中的测量（遵循设置中的「复制」）。"
  measure_delete: "・删除: 使用工具的「删除」，单击测量・辅助线将其删除，拖动可批量删除矩形内的对象。"
  export_image_note: "・图像输出: 通过 命令 → 输出 → 图像输出... 设置带标注图像的保存位置（tif / png / jpg）。按下「重新计算」(F5) 后保存。"
  export_result_note: "・结果输出: 通过 命令 → 输出 → 结果输出... 设置测量结果 JSON 的保存位置。按下「重新计算」(F5) 后保存。"
  pan_zoom_again: "・右键拖动平移，滚轮缩放（测量模式中同样可用）。"

