help:
  title: "操作方法"
  drag_drop: "・画像表示領域にファイルをドラッグ&ドロップすると画像を挿入します。"
  history_files: "・コマンド履歴は .nmjson ファイル（中身は JSON）に保存します。.nmjson のダブルクリックやドラッグ&ドロップで履歴を開けます（関連付けの登録は ヘルプ → ファイル関連付け）。"
  zoom: "・マウスホイールで拡大縮小（カーソル位置を中心）。"
  pan: "・右ドラッグでパン。"
  reopen_params: "・右のリストの行をダブルクリックすると、その処理のパラメータを再編集できます。"
  disable_item: "・チェックを外すと、その処理だけを一時的に無効化できます。"
  select_rows: "・行をクリックすると選択されます。Ctrl クリックで追加・解除、Shift クリックで範囲選択。"
  copy_paste: "・選択した処理は Ctrl+C でコピー、Ctrl+V で貼り付けできます。別のタブへも貼り付けられます。"
  paste_position: "・貼り付けは各カテゴリのリスト末尾に追加されます。"
  category_order: "・処理は 入力 → 前処理 → 解析 → 出力 のカテゴリ順に実行されます。追加した処理はそのカテゴリの末尾に入り、▲▼ でカテゴリ内の順序だけを入れ替えられます。"
  recompute_note: "・並べ替え・有効無効の切り替え・削除・貼り付けは、すぐには計算されません。「再計算」(F5) を押すまで表示（測長の結果を含む）は変わらず、その間ボタンが橙色になります。"
  preview_note: "・パラメータ調整ダイアログ・測長モードを開いている間は、結果をその場で見られるように自動で計算します。閉じたとき（キャンセル時は元の値に戻して）にも計算し直します。"
  change_insert_file: "・画像挿入の行をダブルクリックして読み込むファイルを変えると、すぐに計算し直します。"
  export_on_recompute: "・画像出力・結果出力のファイル保存は「再計算」(F5) を押したときだけ行います（ダイアログの「決定」では保存しません）。"
  reload_sources: "・ディスク上の画像が更新されたときは、コマンド → 元ファイルを読み直して再計算 を使ってください。"
  auto_scale: "・TIFF の FEI / Thermo Fisher タグ、または ImageJ の単位情報から画素の実寸法が読めた場合、画像挿入の直後に「スケール設定」コマンドが自動で追加されます。"
  manual_scale: "・読めなかった場合はスケール未設定となり、実寸法は出せません（画素単位のまま）。コマンド → 入力 → スケール設定 で、スケールバーから読み取った値を手で入れられます。"
  filters: "・フィルタ（ガウシアンぼかし・メディアン・アンシャープマスク）: コマンド → 前処理 → フィルタ から追加できます。"
  measure_intro: "・測長: コマンド → 解析 → 測長... で右パネルが測長ツールに切り替わります。"
  measure_create: "・二点間測長・境界線は、画像上を 2 回クリックして作成します（Esc または右クリックで作成途中をキャンセル）。"
  measure_undo: "・測長モード中は Ctrl+Z / Ctrl+Shift+Z でツール操作の取り消し・やり直しができます。"
  measure_snap: "・スナップ on のとき、二点間測長の端点は既存の境界線・オフセット線に吸い付きます。"
  measure_select_move: "・非選択状態では測長・境界線をクリックして選択し、ドラッグで移動できます（端点付近のクリックは端点だけ、線の上は全体が動きます）。"
  measure_range_select: "・範囲選択: ツールの「範囲選択」でドラッグすると、中心位置が枠内の測長をまとめて選択します。枠の中のドラッグで一括移動、枠の辺・角のドラッグで測長ごと拡大縮小します（反対側の辺が基準）。フィッティングの再計算はドラッグを終えてから行います。"
  measure_fitting: "・フィッティングはピーク（正ピーク固定・負ピーク固定あり）とステップ（正ステップ固定・負ステップ固定あり）を選べます。枠の辺の明暗が方向を示します。"
  measure_fit_edit: "・ツール非選択時にフィッティング領域をダブルクリックすると、その測長だけのフィッティング設定を再編集できます（下部に輝度プロファイルとフィット曲線のプロットが出ます。フィッティングなしのモードはクリック位置に縦線）。"
  measure_duplicate: "・直線複製: 測長・境界線をクリックで選択し、マウス移動で方向と距離を指定して、もう一度クリックで確定。ホイールで複製数 (1-20) を調整し、距離を等分した位置に複製します。"
  measure_duplicate_group: "・複製した測長は、設定の「複製」が「そのまま」なら複製元のグループへ、「グループを追加」なら測長ごとに新しいグループへ入ります。"
  measure_duplicate_ctrl: "・範囲選択の枠の中を Ctrl キーを押しながらドラッグすると、選択中の測長を複製します（設定の「複製」に従います）。"
  measure_delete: "・削除: ツールの「削除」で、測長・補助線をクリックで削除、ドラッグで矩形内のものを一括削除します。"
  export_image_note: "・画像出力: コマンド → 出力 → 画像出力... でアノテーション付き画像の保存先を設定します（tif / png / jpg）。「再計算」(F5) で保存されます。"
  export_result_note: "・結果出力: コマンド → 出力 → 結果出力... で測定結果 JSON / CSV の保存先と形式を設定します。「再計算」(F5) で保存されます。"
  pan_zoom_again: "・右ドラッグでパン、ホイールでズームできます（測長モード中も同じ）。"

