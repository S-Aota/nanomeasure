help:
  title: "사용 방법"
  drag_drop: "・이미지 표시 영역에 파일을 끌어다 놓으면 이미지가 삽입됩니다."
  zoom: "・마우스 휠로 확대/축소(커서 위치가 중심)."
  pan: "・오른쪽 드래그로 팬."
  reopen_params: "・오른쪽 목록의 행을 더블클릭하면 그 처리의 파라미터를 다시 편집할 수 있습니다."
  disable_item: "・체크를 해제하면 그 처리만 일시적으로 비활성화할 수 있습니다."
  select_rows: "・행을 클릭하면 선택됩니다. Ctrl 클릭으로 추가·해제, Shift 클릭으로 범위 선택."
  copy_paste: "・선택한 처리는 Ctrl+C로 복사, Ctrl+V로 붙여넣기할 수 있습니다. 다른 탭에도 붙여넣을 수 있습니다."
  paste_position: "・붙여넣기는 각 카테고리 목록 끝에 추가됩니다."
  category_order: "・처리는 입력 → 전처리 → 해석 → 출력 카테고리 순서로 실행됩니다. 추가한 처리는 해당 카테고리 끝에 들어가며, ▲▼로 카테고리 내 순서만 바꿀 수 있습니다."
  recompute_note: "・정렬·유효/무효 전환·삭제·붙여넣기는 바로 계산되지 않습니다. 「다시 계산」(F5)을 누를 때까지 표시(측정 결과 포함)는 바뀌지 않으며, 그동안 버튼이 주황색이 됩니다."
  preview_note: "・파라미터 조정 다이얼로그·측정 모드를 열고 있는 동안은 결과를 바로 볼 수 있도록 자동으로 계산합니다. 닫을 때(취소 시에는 원래 값으로 되돌리고)에도 다시 계산합니다."
  change_insert_file: "・이미지 삽입 행을 더블클릭하여 읽을 파일을 바꾸면 바로 다시 계산합니다."
  export_on_recompute: "・이미지 출력·결과 출력의 파일 저장은 「다시 계산」(F5)을 누를 때만 수행합니다(다이얼로그의 「확인」에서는 저장하지 않습니다)."
  reload_sources: "・디스크의 이미지가 갱신되었을 때는 명령 → 원본 파일을 다시 읽어 다시 계산 을 사용하세요."
  auto_scale: "・TIFF의 FEI / Thermo Fisher 태그 또는 ImageJ 단위 정보에서 픽셀 실제 치수를 읽을 수 있으면, 이미지 삽입 직후 「스케일 설정」 명령이 자동으로 추가됩니다."
  manual_scale: "・읽을 수 없으면 스케일 미설정이 되어 실제 치수를 표시할 수 없습니다(픽셀 단위 그대로). 명령 → 입력 → 스케일 설정 에서 스케일 바에서 읽은 값을 직접 입력할 수 있습니다."
  filters: "・필터(가우시안 블러·미디안·언샤프 마스크): 명령 → 전처리 → 필터 에서 추가할 수 있습니다."
  measure_intro: "・측정: 명령 → 해석 → 측정... 으로 오른쪽 패널이 측정 도구로 전환됩니다."
  measure_create: "・두 점 측정·경계선은 이미지 위를 2번 클릭하여 만듭니다(Esc 또는 오른쪽 클릭으로 작성 중 취소)."
  measure_undo: "・측정 모드 중에는 Ctrl+Z / Ctrl+Shift+Z 로 도구 조작의 실행 취소·재실행을 할 수 있습니다."
  measure_snap: "・스냅 on일 때, 두 점 측정의 끝점은 기존 경계선·오프셋 선에 달라붙습니다."
  measure_select_move: "・비선택 상태에서는 측정·경계선을 클릭하여 선택하고 드래그로 이동할 수 있습니다(끝점 근처 클릭은 끝점만, 선 위는 전체가 움직입니다)."
  measure_range_select: "・범위 선택: 도구의 「범위 선택」으로 드래그하면 중심 위치가 상자 안에 있는 측정을 모두 선택합니다. 상자 안 드래그로 일괄 이동, 상자의 변·모서리 드래그로 측정째 확대/축소합니다(반대쪽 변이 기준). 피팅 재계산은 드래그를 마친 후 수행합니다."
  measure_fitting: "・피팅은 피크(정 피크 고정·부 피크 고정 있음)와 스텝(정 스텝 고정·부 스텝 고정 있음)을 선택할 수 있습니다. 상자 변의 명암이 방향을 나타냅니다."
  measure_fit_edit: "・도구 비선택 시 피팅 영역을 더블클릭하면 그 측정만의 피팅 설정을 다시 편집할 수 있습니다(아래에 밝기 프로파일과 피팅 곡선 플롯이 표시됩니다. 피팅 없음 모드는 클릭 위치에 세로선)."
  measure_duplicate: "・직선 복제: 측정·경계선을 클릭으로 선택하고, 마우스 이동으로 방향과 거리를 지정하여 한 번 더 클릭으로 확정. 휠로 복제 수(1-20)를 조정하고 거리를 등분한 위치에 복제합니다."
  measure_duplicate_group: "・복제한 측정은 설정의 「복제」가 「그대로」면 복제 원본 그룹으로, 「그룹 추가」면 측정마다 새 그룹으로 들어갑니다."
  measure_duplicate_ctrl: "・범위 선택 상자 안에서 Ctrl 키를 누른 채 드래그하면 선택 중인 측정을 복제합니다(설정의 「복제」를 따릅니다)."
  measure_delete: "・삭제: 도구의 「삭제」로 측정·보조선을 클릭으로 삭제, 드래그로 사각형 안의 것을 일괄 삭제합니다."
  export_image_note: "・이미지 출력: 명령 → 출력 → 이미지 출력... 으로 주석 있는 이미지의 저장 위치를 설정합니다(tif / png / jpg). 「다시 계산」(F5)으로 저장됩니다."
  export_result_note: "・결과 출력: 명령 → 출력 → 결과 출력... 으로 측정 결과 JSON / CSV의 저장 위치와 형식을 설정합니다. 「다시 계산」(F5)으로 저장됩니다."
  pan_zoom_again: "・오른쪽 드래그로 팬, 휠로 줌할 수 있습니다(측정 모드 중에도 동일)."

