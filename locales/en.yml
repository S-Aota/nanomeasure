help:
  title: "How to Use"
  drag_drop: "・Drag & drop a file onto the image area to insert the image."
  zoom: "・Mouse wheel zooms in/out (centered on the cursor)."
  pan: "・Right-drag to pan."
  reopen_params: "・Double-click a row in the right-hand list to edit that process's parameters again."
  disable_item: "・Uncheck a row to temporarily disable just that process."
  select_rows: "・Click a row to select it. Ctrl-click to add/remove, Shift-click for range selection."
  copy_paste: "・Selected processes can be copied with Ctrl+C and pasted with Ctrl+V. They can also be pasted into another tab."
  paste_position: "・Pastes are appended to the end of each category's list."
  category_order: "・Processes run in category order: Input → Preprocess → Analysis → Output. Added processes go to the end of their category; use ▲▼ to reorder within the category only."
  recompute_note: "・Reordering, enabling/disabling, deleting and pasting are not computed immediately. The display (including measure results) stays unchanged until you press \"Recompute\" (F5); the button turns orange meanwhile."
  preview_note: "・While a parameter dialog or measure mode is open, computation runs automatically so you can see results live. It also recomputes when they close (canceling restores the original values)."
  change_insert_file: "・Double-click an Insert Image row to change the file to load; it recomputes immediately."
  export_on_recompute: "・Image Output and Result Output files are saved only when you press \"Recompute\" (F5) (not when pressing \"OK\" in the dialog)."
  reload_sources: "・When the image on disk has been updated, use Command → Reload Source Files and Recompute."
  auto_scale: "・If the pixel size can be read from FEI / Thermo Fisher tags in the TIFF or from ImageJ unit information, a \"Scale Settings\" command is added automatically right after inserting the image."
  manual_scale: "・If it cannot be read, the scale is unset and real dimensions are not shown (pixels only). Use Command → Input → Scale Settings to enter a value read from the scale bar by hand."
  filters: "・Filters (Gaussian blur, median, unsharp mask): add via Command → Preprocess → Filter."
  measure_intro: "・Measure: Command → Analysis → Measure... switches the right panel to the measure tools."
  measure_create: "・Two-point measurements and boundary lines are created by clicking twice on the image (press Esc or right-click to cancel while creating)."
  measure_undo: "・In measure mode, Ctrl+Z / Ctrl+Shift+Z undo/redo tool operations."
  measure_snap: "・With snap on, endpoints of two-point measurements stick to existing boundary and offset lines."
  measure_select_move: "・With no tool selected, click a measurement or boundary line to select it and drag to move it (clicking near an endpoint moves just the endpoint; clicking on the line moves the whole line)."
  measure_range_select: "・Range select: drag with the \"Range Select\" tool to select all measurements whose center lies inside the box. Drag inside the box to move them together; drag an edge or corner to scale them together (the opposite edge is the anchor). Fitting is recomputed after the drag ends."
  measure_fitting: "・Fitting can be peak (fixed positive / fixed negative peak) or step (fixed positive / fixed negative step). The brightness of the box edges indicates the direction."
  measure_fit_edit: "・With no tool selected, double-click a fitting region to edit that measurement's fitting settings (a plot of the intensity profile and fitted curve appears below; with no fitting, a vertical line is shown at the click position)."
  measure_duplicate: "・Duplicate line: click a measurement or boundary line to select it, move the mouse to set direction and distance, and click again to confirm. Use the wheel to adjust the copy count (1-20); copies are placed at evenly divided positions along the distance."
  measure_duplicate_group: "・Duplicated measurements go into the source group if \"Duplicate\" is \"As is\" in the settings, or into a new group per measurement if it is \"Add group\"."
  measure_duplicate_ctrl: "・Ctrl-drag inside the range-select box to duplicate the selected measurements (follows the \"Duplicate\" setting)."
  measure_delete: "・Delete: with the \"Delete\" tool, click a measurement or helper line to delete it, or drag to delete everything inside the rectangle at once."
  export_image_note: "・Image Output: set the save destination for the annotated image via Command → Output → Image Output... (tif / png / jpg). Saved when you press \"Recompute\" (F5)."
  export_result_note: "・Result Output: set the save destination and format (JSON / CSV) for the measurement results via Command → Output → Result Output... Saved when you press \"Recompute\" (F5)."
  pan_zoom_again: "・Right-drag to pan and use the wheel to zoom (same in measure mode)."

