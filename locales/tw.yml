help:
  title: "操作方法"
  drag_drop: "・將檔案拖放到影像顯示區域即可插入影像。"
  history_files: "・命令紀錄儲存為 .nmjson 檔案（內容為 JSON）。按兩下 .nmjson 或將其拖放到視窗中即可開啟紀錄（關聯的登錄方法見 說明 → 檔案關聯）。"
  zoom: "・使用滑鼠滾輪放大縮小（以游標位置為中心）。"
  pan: "・右鍵拖曳平移。"
  reopen_params: "・在右側清單的列上按兩下，可重新編輯該處理的參數。"
  disable_item: "・取消勾選可暫時停用該處理。"
  select_rows: "・按一下列可將其選取。Ctrl 按一下可新增・取消，Shift 按一下可選取範圍。"
  copy_paste: "・選取的處理可用 Ctrl+C 複製、Ctrl+V 貼上。也可貼到其他分頁。"
  paste_position: "・貼上內容會新增到各分類清單的末尾。"
  category_order: "・處理按 輸入 → 前處理 → 分析 → 輸出 的分類順序執行。新增的處理進入該分類的末尾，可用 ▲▼ 僅調整分類內的順序。"
  recompute_note: "・排序、啟用・停用切換、刪除、貼上不會立即計算。在按下「重新計算」(F5) 之前，顯示（包括測量結果）保持不變，期間按鈕變為橙色。"
  preview_note: "・開啟參數調整對話方塊或測量模式時，會自動計算以便立即查看結果。關閉時（取消時恢復原值）也會重新計算。"
  change_insert_file: "・按兩下插入影像的列以變更要讀取的檔案，會立即重新計算。"
  export_on_recompute: "・影像輸出、結果輸出的檔案儲存僅在按下「重新計算」(F5) 時執行（不會在對話方塊的「確定」時儲存）。"
  reload_sources: "・磁碟上的影像已更新時，請使用 命令 → 重新讀取來源檔案並重新計算。"
  auto_scale: "・如果可從 TIFF 的 FEI / Thermo Fisher 標籤或 ImageJ 的單位資訊讀取像素的實際尺寸，插入影像後會立即自動新增「比例尺設定」命令。"
  manual_scale: "・無法讀取時，比例尺為未設定狀態，無法顯示實際尺寸（維持像素單位）。可透過 命令 → 輸入 → 比例尺設定 手動輸入從比例尺條讀取的值。"
  filters: "・濾鏡（高斯模糊・中值濾鏡・反銳化遮罩）: 可透過 命令 → 前處理 → 濾鏡 新增。"
  measure_intro: "・測量: 透過 命令 → 分析 → 測量... 將右側面板切換為測量工具。"
  measure_create: "・兩點測量・邊界線透過在影像上按兩下建立（按 Esc 或右鍵可取消建立過程）。"
  measure_undo: "・測量模式中，可用 Ctrl+Z / Ctrl+Shift+Z 復原・重做工具操作。"
  measure_snap: "・吸附開啟時，兩點測量的端點會吸附到現有的邊界線・偏移線上。"
  measure_select_move: "・未選取工具時，可按一下測量・邊界線將其選取並拖曳移動（按一下端點附近僅移動端點，按一下線上則整體移動）。"
  measure_range_select: "・範圍選取: 使用工具的「範圍選取」拖曳時，會一併選取中心位置位於框內的測量。在框內拖曳可整體移動，拖曳框的邊・角可連同測量一起縮放（以對邊為基準）。擬合的重新計算在拖曳結束後進行。"
  measure_fitting: "・擬合可選擇峰值（固定正峰・固定負峰）和階梯（固定正階梯・固定負階梯）。框邊緣的明暗表示方向。"
  measure_fit_edit: "・未選取工具時，按兩下擬合區域可重新編輯僅該測量的擬合設定（下方會顯示亮度剖面和擬合曲線的圖表。無擬合模式在按一下位置顯示垂直線）。"
  measure_duplicate: "・直線複製: 按一下測量・邊界線將其選取，移動滑鼠指定方向和距離，再按一下確認。用滾輪調整複製數量 (1-20)，在距離等分的位置進行複製。"
  measure_duplicate_group: "・複製的測量，若設定中的「複製」為「原樣」則進入複製來源的群組，為「新增群組」則每個測量進入新群組。"
  measure_duplicate_ctrl: "・在範圍選取的框內按住 Ctrl 鍵拖曳，可複製選取的測量（遵循設定中的「複製」）。"
  measure_delete: "・刪除: 使用工具的「刪除」，按一下測量・輔助線將其刪除，拖曳可批次刪除矩形內的物件。"
  export_image_note: "・影像輸出: 透過 命令 → 輸出 → 影像輸出... 設定含標註影像的儲存位置（tif / png / jpg）。按下「重新計算」(F5) 後儲存。"
  export_result_note: "・結果輸出: 透過 命令 → 輸出 → 結果輸出... 設定測量結果 JSON / CSV 的儲存位置與格式。按下「重新計算」(F5) 後儲存。"
  pan_zoom_again: "・右鍵拖曳平移，滾輪縮放（測量模式中亦同）。"

